[package]
name = "tauri-plugin-my-plugin"
version = "0.1.0"
edition = "2021"
description = "Tauri v2 plugin my-plugin (desktop-first upload with progress Channel)"
license = "MIT OR Apache-2.0"

[lib]
name = "tauri_plugin_my_plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"

[package.metadata.platforms.support]
windows = { level = "full" }
linux = { level = "full" }
macos = { level = "full" }
android = { level = "partial", notes = "Upload works via system picker; background upload is limited by the OS, progress events may be coalesced." }
ios = { level = "none" }
