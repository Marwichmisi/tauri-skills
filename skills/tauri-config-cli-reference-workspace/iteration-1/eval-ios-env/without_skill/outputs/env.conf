# Env pour dev/build iOS (macOS)
TAURI_CLI_PORT=1430
CI=true
# IP LAN du Mac pour iPhone physique (même Wi-Fi). Exemple: 192.168.1.20
# TAURI_DEV_HOST=192.168.1.20
TAURI_DEV_HOST=$(ipconfig getifaddr en0)

