# Env iOS documentées (reference/environment-variables.mdx + _cli_ios.mdx).
# Règle doc : si variable d'environnement et flag CLI coexistent, le flag prime.

# CLI dev : CI sans interaction, port du serveur dev intégré (--port).
CI=true
TAURI_CLI_PORT=1430

# iOS device physique (_cli_ios.mdx) : devUrl localhost remplacé par l'adresse
# publique automatiquement ; à lire côté framework (ex Vite : server.host).
TAURI_DEV_HOST=192.168.1.20

# Hooks beforeDevCommand/beforeBuildCommand (même fichier, lecture seule côté hook) :
# Ne pas exporter TAURI_ENV_* ici — le hook les lit seulement :
#   TAURI_ENV_DEBUG=true en `dev` / `build --debug`
#   TAURI_ENV_PLATFORM=darwin sur macOS (windows|darwin|linux…)
if [ "$TAURI_ENV_PLATFORM" = "darwin" ]; then echo "hook macOS, debug=$TAURI_ENV_DEBUG"; fi
